[project]
name = "bdc2026-candidate-d"
version = "1.0.0"
description = "Deterministic BDC2026 Market Intelligence ranker submission"
readme = "readme.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.3.3",
    "pandas==2.3.2",
    "torch==2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
